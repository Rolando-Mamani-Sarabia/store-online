<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda-Online-Tenis</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="header">
  <h1 class="titulo-principal">Tienda-Online-Tenis</h1>
    <nav class="menu">
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#productos">Productos</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>
</header>

<main class="contenido">

  <!-- Descripción -->
  <section id="productos">
    <p class="descripcion">Bienvenido a nuestra tienda online de tenis. Aqui encontrarás los mejores modelos y ofertas</p>
  </section>

  <!-- Formulario -->
  <section id="contacto">
    <h2>Contáctanos</h2>
      <form id="form-contacto" method="POST" action="procesar.php" novalidate >
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required>

          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo" required>

          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" required></textarea>

          <button type="submit">Enviar mensaje</button>

          <p id="aviso-contacto" class="aviso"> </p>

      </form>
</section>

</main>

<footer class="footer">
  <p class="coryrigth">&copy; 2026 Tienda-Online-Tenis. Rolando Mamani Sarabia.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
