<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Veterinaria Patitas</title>
</head>
<body>

  <header>
    <h1>Veterinaria Patitas</h1>
    <p>
      Somos una veterinaria de barrio que cuida a tu mascotita como si fuera de la familia.
      llena el formulario de forma online para reservar tu turno.
    </p>
  </header>

  <main>
    <form id="form-turno" method="post" action="procesar.php" novalidate>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" required>

      <label for="mascota">Contanos de tu mascota</label>
      <textarea id="mascota" name="mascota"></textarea>

      <button type="submit">Reservar mi turno</button>
      <p id="aviso-turno" class="aviso"></p>

    </form>
  </main>

  <footer>
    <p>Parcial 2 - Rolando Mamani Sarabia - 20 de octubre de 2026</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
